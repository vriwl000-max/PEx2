{% extends 'base.html' %}

{% block title %}
Editar Departamento
{% endblock %}

{% block content %}

<div class="page-heading">

    <span class="eyebrow">
        GESTIÓN / DEPARTAMENTOS
    </span>

    <h1>Editar Departamento</h1>

    <p>
        Actualiza la información del departamento seleccionado.
    </p>

</div>

<section class="content-card form-card">

    <form method="post">

        {% csrf_token %}

        <div class="django-form">
            {{ form.as_p }}
        </div>

        <div class="form-actions">

            <a href="{% url 'lista_departamentos' %}"
               class="secondary-button">
                Cancelar
            </a>

            <button type="submit"
                    class="primary-button">
                Guardar Cambios
            </button>

        </div>

    </form>

</section>

{% endblock %}
