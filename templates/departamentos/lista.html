{% extends 'base.html' %}

{% block title %}
Departamentos
{% endblock %}

{% block content %}

<h1>Departamentos</h1>

<a href="{% url 'crear_departamento' %}">
    Crear Departamento
</a>

<hr>

{% for d in departamentos %}
    <p>{{ d.nombre }}</p>
{% empty %}
    <p>No existen departamentos registrados.</p>
{% endfor %}

{% endblock %}
