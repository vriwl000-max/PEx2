{% extends 'base.html' %}

{% block title %}
Crear Cargo
{% endblock %}

{% block content %}

<div class="page-heading">
    <h1>Crear Cargo</h1>

    <p>
        Registra un nuevo cargo.
    </p>
</div>

<section class="content-card form-card">

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="primary-button">
            Guardar
        </button>

    </form>

</section>

{% endblock %}
